services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: portal-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: change-me
    networks:
      - proxy_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: portal-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
