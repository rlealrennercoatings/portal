# Configuração de exemplo para o nginx_proxy do RHSA342.
# Copie este arquivo para o diretório de configs do nginx_proxy
# (ex.: /srv/proxy/conf.d/portal.conf ou onde ficam os demais vhosts,
# ao lado da config do ender.renner.com.br) e recarregue o container:
#   docker exec nginx_proxy nginx -s reload
#
# Pré-requisito: DNS "portal.rennercoatings.com" apontando para o RHSA342
# e certificado emitido (certbot/Let's Encrypt) para esse domínio.

server {
    listen 80;
    server_name portal.rennercoatings.com;

    # Redireciona tudo para HTTPS, igual ao padrão dos demais domínios
    location / {
        return 301 https://$host$request_uri;
    }

    # Necessário para o desafio HTTP-01 do certbot, se for emitir o
    # certificado a partir deste próprio nginx_proxy.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    server_name portal.rennercoatings.com;

    ssl_certificate     /etc/letsencrypt/live/portal.rennercoatings.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.rennercoatings.com/privkey.pem;

    # Aplicação inteira (front-end estático + API) é servida por um único
    # container FastAPI (portal_app), então todo o tráfego vai para ele.
    location / {
        proxy_pass http://portal_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
