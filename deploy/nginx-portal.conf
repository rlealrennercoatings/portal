# Configuração para o nginx_proxy do RHSA342 (mesmo padrão do vhost
# ender.renner.com.br, reaproveitando o certificado wildcard *.renner.com.br
# já existente). Copie para o diretório de configs do nginx_proxy
# (ex.: /srv/proxy/nginx/conf.d/portal.conf) e recarregue:
#   docker exec nginx_proxy nginx -t
#   docker exec nginx_proxy nginx -s reload

server {
    listen 443 ssl;
    server_name portal.renner.com.br;

    ssl_certificate     /etc/nginx/certs/renner.com.br/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/renner.com.br/renner.com.br.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!MEDIUM:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;

    # 🌐 Aplicação inteira (frontend estático + API) servida por um único
    # container FastAPI (portal_app), na porta 8000.
    location / {
        proxy_pass http://portal_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name portal.renner.com.br;

    return 301 https://$host$request_uri;
}
