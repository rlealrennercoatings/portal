services:
  portal_app:
    build: .
    container_name: portal_app
    env_file:
      - backend/.env
    restart: unless-stopped
    networks:
      - proxy_net
    # Nenhuma porta é publicada no host: o nginx_proxy acessa o container
    # diretamente pela rede Docker interna "proxy_net" (mesmo conceito
    # usado pelo Ender Contatos: contatos_web/contatos_api).

networks:
  proxy_net:
    external: true
